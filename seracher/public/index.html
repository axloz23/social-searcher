<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSINT Searcher Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .glass { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .btn-visit { background: #1f6feb; transition: 0.2s; }
        .btn-visit:hover { background: #388bfd; transform: scale(1.05); }
        .platform-row { border-bottom: 1px solid #21262d; transition: 0.2s; }
        .platform-row:hover { background: #1c2128; }
    </style>
</head>
<body class="p-10">
    <div class="max-w-4xl mx-auto">
        
        <div class="glass p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center text-xl font-bold">22</div>
                    <h1 id="userLabel" class="text-xl font-bold">Enter Username...</h1>
                </div>
                <button onclick="massOpen()" class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold text-sm hover:bg-yellow-400">
                    🚀 Mass Scan (Open 10)
                </button>
            </div>
            <div class="grid grid-cols-4 gap-4 text-center">
                <div class="p-2 bg-[#0d1117] rounded border border-gray-800"><p class="text-xs text-gray-500 uppercase">Searched</p><p class="font-bold">100+</p></div>
                <div class="p-2 bg-[#0d1117] rounded border border-gray-800"><p class="text-xs text-gray-500 uppercase">Found</p><p class="font-bold text-green-500">0</p></div>
                <div class="p-2 bg-[#0d1117] rounded border border-gray-800"><p class="text-xs text-gray-500 uppercase">Status</p><p class="font-bold text-pink-500">Active</p></div>
                <div class="p-2 bg-[#0d1117] rounded border border-gray-800"><p class="text-xs text-gray-500 uppercase">Speed</p><p class="font-bold text-blue-400">Ultra</p></div>
            </div>
        </div>

        <input type="text" id="target" placeholder="Type username and press enter..." 
               class="w-full p-4 glass outline-none focus:border-blue-500 mb-6 text-lg"
               oninput="updateUI()">

        <div class="glass overflow-hidden">
            <div id="list"></div>
        </div>
    </div>

    <script>
        const sites = [
            { name: "TikTok", url: "https://tiktok.com/@", icon: "fa-tiktok", color: "text-white" },
            { name: "Instagram", url: "https://instagram.com/", icon: "fa-instagram", color: "text-pink-500" },
            { name: "YouTube", url: "https://youtube.com/@", icon: "fa-youtube", color: "text-red-500" },
            { name: "X / Twitter", url: "https://x.com/", icon: "fa-x-twitter", color: "text-white" },
            { name: "Snapchat", url: "https://snapchat.com/add/", icon: "fa-snapchat", color: "text-yellow-400" },
            { name: "Reddit", url: "https://reddit.com/user/", icon: "fa-reddit", color: "text-orange-500" },
            { name: "Pinterest", url: "https://pinterest.com/", icon: "fa-pinterest", color: "text-red-600" },
            { name: "GitHub", url: "https://github.com/", icon: "fa-github", color: "text-white" }
        ];

        function updateUI() {
            const val = document.getElementById('target').value || "username";
            document.getElementById('userLabel').innerText = val;
            const list = document.getElementById('list');
            
            list.innerHTML = sites.map(s => `
                <div class="platform-row p-4 flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <i class="fa-brands ${s.icon} ${s.color} text-xl w-8"></i>
                        <div>
                            <p class="font-bold text-sm">${s.name}</p>
                            <p class="text-xs text-gray-500">${s.url}${val}</p>
                        </div>
                    </div>
                    <button onclick="window.open('${s.url}${val}', '_blank')" class="btn-visit px-4 py-2 rounded font-bold text-xs">Visit →</button>
                </div>
            `).join('');
        }

        function massOpen() {
            const val = document.getElementById('target').value;
            if(!val) return alert("Enter username!");
            sites.forEach(s => window.open(s.url + val, '_blank'));
        }

        updateUI();
    </script>
</body>
</html>
